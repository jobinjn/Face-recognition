<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📸 Real-Time Face Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .video-box { border: 4px solid #4CAF50; border-radius: 15px; }
    </style>
</head>
<body class="bg-light text-center">
    <div class="container py-4">
        <h2 class="mb-4">📸 <b>Real-Time Face Attendance</b></h2>
        <img src="{{ url_for('video_feed') }}" class="video-box" width="640" height="480">

        <div class="my-4">
            <label for="date-select" class="form-label"><b>📅 Select Date:</b></label>
            <select id="date-select" class="form-select w-auto d-inline-block"></select>
            <a id="download-link" class="btn btn-primary ms-2" href="#" target="_blank">⬇️ Download</a>
        </div>

        <table class="table table-bordered bg-white">
            <thead>
                <tr><th>Name</th><th>Time</th></tr>
            </thead>
            <tbody id="attendance-body">
                <tr><td colspan="2">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadDates() {
            const res = await fetch("/dates");
            const dates = await res.json();
            const select = document.getElementById("date-select");
            select.innerHTML = "";
            dates.reverse().forEach(date => {
                const opt = document.createElement("option");
                opt.value = date;
                opt.textContent = date;
                select.appendChild(opt);
            });
            if (dates.length) {
                select.value = dates[0];
                loadAttendance(dates[0]);
            }
        }

        async function loadAttendance(date) {
            const res = await fetch(`/attendance/${date}`);
            const data = await res.json();
            const body = document.getElementById("attendance-body");
            const downloadLink = document.getElementById("download-link");

            body.innerHTML = data.length === 0
                ? "<tr><td colspan='2'>No attendance marked.</td></tr>"
                : data.map(d => `<tr><td>${d.name}</td><td>${d.time}</td></tr>`).join("");

            downloadLink.href = `/download/${date}`;
        }

        document.getElementById("date-select").addEventListener("change", e => {
            loadAttendance(e.target.value);
        });

        loadDates();
    </script>
</body>
</html>
